<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FundIQ - Create an Account</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/chat.css">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="logo">
            <img src="/assets/fundiq-logo.png" alt="FundIQ - Find. Fund. Forward.">
        </div>

        <div class="login-card">

            <h1>Create an Account</h1>

            <p>Sign up to start organizing your personal finances.</p>

            <div id="registerError" class="auth-error-msg" style="display:none;" role="alert"></div>

            <form id="registerForm">

                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    autocomplete="username"
                    minlength="3"
                    maxlength="30"
                    required
                >
                <small class="field-hint">3–30 characters, letters, numbers, and underscores.</small>

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password (min. 8 characters)"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="100"
                    required
                >
                <small class="field-hint">Minimum 8 characters.</small>

                <button type="submit" id="registerBtn">
                    Create Account
                </button>

            </form>

            <p class="auth-switch">
                Already have an account? <a href="index.html">Log In</a>
            </p>

            <p class="demo-note">
                Passwords are encrypted using secure bcrypt hashing.
            </p>

        </div>

    </div>

    <script src="js/register.js"></script>
    <script src="js/chat.js" defer></script>

</body>
</html>
