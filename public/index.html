<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FundIQ - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/chat.css">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="logo">
            <img src="/assets/fundiq-logo.png" alt="FundIQ - Find. Fund. Forward.">
        </div>

        <p class="tagline">
            Organize your money. Understand your finances.
        </p>

        <div class="login-card">

            <h1>Welcome Back!</h1>

            <p>Log in to continue to your FundIQ account.</p>

            <div id="loginSuccess" class="auth-success-msg" style="display:none;" role="status"></div>
            <div id="loginError" class="auth-error-msg" style="display:none;" role="alert"></div>

            <form id="loginForm">

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" id="loginBtn">
                    Log In
                </button>

            </form>

            <p class="auth-switch">
                Don't have an account? <a href="register.html">Create an account</a>
            </p>

            <p class="demo-note">
                Protected by secure server-side session authentication.
            </p>

        </div>

    </div>

    <script src="js/login.js"></script>
    <script src="js/chat.js" defer></script>

</body>
</html>
