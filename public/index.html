<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FundIQ - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="logo">
            FundIQ
        </div>

        <p class="tagline">
            Organize your money. Understand your finances.
        </p>

        <div class="login-card">

            <h1>Welcome Back!</h1>

            <p>Log in to continue to your FundIQ account.</p>

            <form id="loginForm">

                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Log In
                </button>

            </form>

            <p class="demo-note">
                Prototype login — account database coming later.
            </p>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>
</html>
